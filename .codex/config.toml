# Codex model config — model names deprecate fast.
# Check `/status` in Codex or developers.openai.com/codex/models before locking.
# gpt-5.4 deployment retired (404); global ~/.codex/config.toml records the
# migration gpt-5.4 -> gpt-5.6-terra. Track that mapping here too.
model = "gpt-5.6-terra"
# Applies to the interactive Codex CLI session only. Delegation through a
# subagent passes its own model/effort per task (see
# docs/runbooks/providers/codex.md).
model_reasoning_effort = "medium"
